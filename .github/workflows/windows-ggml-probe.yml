# Temporary probe for neuml/txtai#1584: does llama-cpp-python 0.3.37 break the GGML ANN backend on Windows?
name: windows-ggml-probe

on: ["push", "workflow_dispatch"]

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        llama: ["0.3.36", "0.3.37"]
        order: ["ggml-only", "llama-first"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install -U wheel
          pip install .[ann] llama-cpp-python==${{ matrix.llama }}
          pip list | Select-String -Pattern "ggml|llama"

      - name: Run GGML tests
        env:
          PYTHONPATH: test/python
          LLAMA_FIRST: ${{ matrix.order == 'llama-first' && '1' || '' }}
        run: |
          python -c "import os, sys, unittest; os.environ.get('LLAMA_FIRST') and __import__('llama_cpp'); r = unittest.main(module='testann.testdense.testggml', argv=['x', '-v'], exit=False).result; sys.exit(0 if r.wasSuccessful() else 1)"
